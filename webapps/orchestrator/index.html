<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SNT Pipelines Orchestrator — Cockpit</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Cockpit UI: a focused, one-step-at-a-time guided walkthrough.
         A slim progress rail on the left shows the whole journey + "you are
         here"; the central panel carries everything for the focused step
         (dependencies, parameters, run, outputs). Back / Next walk the
         recommended order; mutually-exclusive alternative groups (A.3 outliers,
         A.4 reporting rate) appear as a single "choose one" step.

         The shell is empty on load — app.js fetches the bundled
         pipeline_map.json + pipeline_descriptions.json, reads this workspace's
         pipeline_cards.json live from the workspace bucket (written by the
         create_pipeline_cards pipeline, so config changes need no redeploy),
         merges them, then renders the rail and cockpit and wires the live
         OpenHEXA calls (status, run, poll, outputs). -->
    <header class="appbar">
      <!-- Logo mark: one tile per track, coloured by --A..--D in styles.css. -->
      <h1>
        <svg class="mark" viewBox="0 0 26 26" aria-hidden="true">
          <rect class="a" x="1" y="1" width="11" height="11" rx="3" />
          <rect class="b" x="14" y="1" width="11" height="11" rx="3" />
          <rect class="c" x="1" y="14" width="11" height="11" rx="3" />
          <rect class="d" x="14" y="14" width="11" height="11" rx="5.5" />
        </svg>
        <span>SNT <span class="sub">Pipelines Orchestrator</span></span>
      </h1>
      <div class="nav">
        <button class="nbtn" id="backBtn" type="button">&#9666; Back</button>
        <span class="stepcount" id="stepcount"></span>
        <button class="nbtn primary" id="nextBtn" type="button">Next &#9656;</button>
      </div>
      <div class="appbar-right">
        <div class="ws"><span id="wsWord">Workspace:</span> <b id="workspaceLabel">—</b></div>
        <!-- Language toggle (EN / FR). app.js reads the choice (?lang= /
             localStorage / default en), wires these buttons, and re-renders
             everything on switch. -->
        <div class="langtoggle" role="group" aria-label="Language">
          <button type="button" class="langbtn" data-lang="en">EN</button>
          <button type="button" class="langbtn" data-lang="fr">FR</button>
        </div>
      </div>
    </header>

    <div class="shell">
      <nav class="rail" id="rail" aria-label="Pipeline walkthrough steps"></nav>
      <div class="cockpit-wrap">
        <div class="cockpit" id="cockpit"></div>
      </div>
    </div>

    <!-- Local development (ADR 0014): OpenHEXA's dev shim. Only active on
         localhost / 127.0.0.1 / file:// — inert when served by OpenHEXA. It
         must stay a plain (not async/defer) script before app.js: it sets
         window.OPENHEXA and reroutes /graphql/ before app.js boots. No
         data-* slugs here — the bundle is workspace-independent; pick the
         webapp in the "Connect to OpenHEXA" picker instead. -->
    <script src="https://api.openhexa.org/webapps/dev.js"></script>
    <script src="app.js"></script>
  </body>
</html>
